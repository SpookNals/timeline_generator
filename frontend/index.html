<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV Timeline</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<div id="intro" aria-hidden="true"><div class="intro-mark"><svg viewBox="0 0 320 160"><path class="draw axis" d="M20 80H300"/><path class="draw branches" d="M70 80V35H115 M160 80V125H205 M250 80V35H290"/><g class="nodes"><circle cx="70" cy="80" r="5"/><circle cx="160" cy="80" r="5"/><circle cx="250" cy="80" r="5"/></g></svg><span>CV TIMELINE</span></div></div>
<div id="app">
<header class="chrome"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16h22M10 16V7h7M22 16v9h-7"/><circle cx="10" cy="16" r="2"/><circle cx="22" cy="16" r="2"/></svg><span>CV <b>Timeline</b></span></div><div class="filename" id="filename">Untitled</div><nav aria-label="File"><button id="open">Open</button><button id="save">Save</button><button id="save-as" title="Save as">Save as</button><button class="primary" id="export">Export PNG <span aria-hidden="true">↗</span></button></nav></header>
<div class="workspace">
<aside class="chrome"><div class="section-title"><h1>Periods</h1><span id="count">00</span></div><div class="range"><label>From<input id="range-start" type="number" min="1" max="9998" value="2015"></label><span>—</span><label>To<input id="range-end" type="number" min="2" max="9999" value="2026"></label></div><div class="ruler" aria-hidden="true"></div><button class="add" id="add">＋ New period</button><div id="blocks" class="blocks"></div><div class="aside-bottom"><span class="time-dot"></span><span id="range-label">2015 — 2026</span><button id="effects" aria-pressed="true" title="Toggle scanlines">Scanlines</button></div></aside>
<main id="editor"><div class="editor-toolbar"><div><span class="eyebrow">WORKSHEET</span><h2>My timeline</h2></div><div class="zoom"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-reset" title="Fit to width">100%</button><button id="zoom-in" aria-label="Zoom in">＋</button></div></div><div id="paper-scroll"><div id="paper"></div><div id="empty"><span class="empty-icon" aria-hidden="true">┆</span><h3>No periods yet</h3><button id="empty-add">Add period <span aria-hidden="true">＋</span></button></div></div><footer><span id="status" role="status">Ready</span><span>PNG · 2× resolution</span></footer></main>
</div></div>
<dialog id="block-dialog" aria-labelledby="form-heading"><form id="block-form"><div class="dialog-head"><h2 id="form-heading">New period</h2><button type="button" id="cancel-x" aria-label="Close">×</button></div><label>Title<input id="title" required maxlength="160" autocomplete="off" placeholder="e.g. Product designer"></label><label>Company<input id="subtitle" maxlength="300" autocomplete="off" placeholder="Company or institution"></label><div class="dates"><label>From<input id="start" type="month" required></label><label>To<input id="end" type="month" required></label></div><label>Description<textarea id="description" maxlength="1000" rows="3" placeholder="What would you like to share?"></textarea></label><div class="label-controls"><output id="duration">0 months</output><button type="button" id="reset-position">Reset label position</button></div><label class="color-label">Color<input id="color" type="color" value="#bd864b"></label><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="delete" class="danger">Delete</button><span></span><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Save period</button></div></form></dialog>
</body></html>
