[package]
name = "cv_timeline"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
tauri = { version = "2", features = [] }
egui = { version = "0.36.1", features = ["serde"] }
image = "0.25.10"
imageproc = "0.27.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
